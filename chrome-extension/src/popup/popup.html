<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pocket Option AI PRO</title>

    <link rel="stylesheet" href="popup.css">

</head>

<body>

    <div class="container">

        <!-- ========================= -->
        <!-- Header -->
        <!-- ========================= -->

        <div class="header">

            <div>

                <h2>Pocket Option AI PRO</h2>

                <span class="version">
                    Professional Edition
                </span>

            </div>

            <div id="status" class="status offline">

                ● Offline

            </div>

        </div>

        <!-- ========================= -->
        <!-- Signal Card -->
        <!-- ========================= -->

        <div class="signal-card card">

            <div id="action" class="action wait">

                WAIT

            </div>

            <div class="gauge">

                <svg width="150" height="150">

                    <circle cx="75" cy="75" r="60" class="gauge-bg" />

                    <circle id="gauge" cx="75" cy="75" r="60" class="gauge-progress" />

                </svg>

                <div id="confidenceText" class="gauge-text">

                    0%

                </div>

            </div>

        </div>

        <!-- ========================= -->
        <!-- Information -->
        <!-- ========================= -->

        <div class="info-grid">

            <div class="card">

                <span>Trend</span>

                <strong id="trend">

                    ---

                </strong>

            </div>

            <div class="card">

                <span>Risk</span>

                <strong id="risk">

                    ---

                </strong>

            </div>

            <div class="card">

                <span>Asset</span>

                <strong id="asset">

                    ---

                </strong>

            </div>

            <div class="card">

                <span>Expiration</span>

                <strong id="expiration">

                    ---

                </strong>

            </div>

        </div>

        <!-- ========================= -->
        <!-- AI Analysis -->
        <!-- ========================= -->

        <div class="analysis card">

            <h3>

                🧠 AI Analysis

            </h3>

            <div id="analysis">

                Waiting for analysis...

            </div>

        </div>

        <!-- ========================= -->
        <!-- Session Statistics -->
        <!-- ========================= -->

        <div class="stats card">

            <h3>

                📊 Today's Session

            </h3>

            <div class="stats-grid">

                <div class="stat">

                    <span>

                        🟢 CALL

                    </span>

                    <strong id="callCount">

                        0

                    </strong>

                </div>

                <div class="stat">

                    <span>

                        🔴 PUT

                    </span>

                    <strong id="putCount">

                        0

                    </strong>

                </div>

                <div class="stat">

                    <span>

                        🟡 WAIT

                    </span>

                    <strong id="waitCount">

                        0

                    </strong>

                </div>

                <div class="stat">

                    <span>

                        Total

                    </span>

                    <strong id="totalCount">

                        0

                    </strong>

                </div>

            </div>

        </div>

        <!-- ========================= -->
        <!-- Signal History -->
        <!-- ========================= -->

        <div class="history card">

            <h3>

                📜 Signal History

            </h3>

            <div id="history">

                No signals yet

            </div>

        </div>

        <!-- ========================= -->
        <!-- Footer -->
        <!-- ========================= -->

        <div class="footer">

            Last Update

            <div id="updated">

                --

            </div>

        </div>

    </div>

    <script type="module" src="./popup.js"></script>

</body>

</html>
